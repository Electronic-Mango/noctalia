name: Clear Waiting Labels

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  clear:
    if: ${{ github.repository == 'noctalia-dev/noctalia' && !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      # When the reporter answers, drop the waiting labels so the daily stale pass
      # does not close an issue that has been answered.
      - name: Remove waiting labels on reporter reply
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const { issue, comment } = context.payload;
            if (comment.user.login !== issue.user.login) return;
            const { owner, repo } = context.repo;
            const present = new Set(issue.labels.map(label => label.name));
            for (const name of ['needs-info', 'needs-retest', 'stale']) {
              if (!present.has(name)) continue;
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
